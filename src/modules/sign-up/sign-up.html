<section class="sign-up-container">
  
    <div class="sign-up-form-container">
      <div class="sign-up-card">
        <div class="sign-up-title">
          <h2>Cadastro</h2>
          <p>Faça seu cadastro para acessar o sistema</p>
        </div>
        
        <form class="sign-up-form" (ngSubmit)="onSignUp()">
          <div class="form-group">
            <label for="username">Nome</label>
            <div class="input-container">
              <input 
                type="text" 
                id="userName" 
                name="userName" 
                [(ngModel)]="credentials.userName"
                placeholder="Digite seu nome"
                required
              >
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">Email</label>
            <div class="input-container">
              <input 
                type="email" 
                id="email" 
                name="email" 
                [(ngModel)]="credentials.email"
                placeholder="Digite seu email"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-container">
              <input 
                type="password" 
                id="password" 
                name="password" 
                [(ngModel)]="credentials.password"
                placeholder="Digite sua senha"
                required
              >
            </div>
            <p class="error-message">{{ messageError }}</p>
          </div>
          
          <button type="submit" class="sign-up-button" [disabled]="isLoading">
            <span *ngIf="!isLoading">Cadastrar</span>
            <span *ngIf="isLoading" class="loading-spinner">⏳</span>
          </button>
        </form>
      </div>
    </div>
  </section>
